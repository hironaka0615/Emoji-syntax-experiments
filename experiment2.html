    });

    // -----------------------------------------------------------------
    // 5. 試行を作成する関数 (Fixation + Task + Feedback)
    // -----------------------------------------------------------------
    function createExp2Trial(stim_data, is_practice, current_trial_order) {
        let trial_context = {};

        // 注視点 (1000ms = 1秒)
        const fixation = {
            type: jsPsychHtmlKeyboardResponse,
            // 選択肢と同じ透明なスペースを下に作ることで、十字（+）を絵文字と全く同じ高さに押し上げます
            stimulus: `
                <div class="emoji-container" style="align-items: center; justify-content: center;">
                    <div style="font-size: 80px; height: 120px; display: flex; align-items: center; color: #333;">+</div>
                </div>
                <div class="choices-container" style="visibility: hidden;">
                    <div class="choice-row">① ダミー</div>
                    <div class="choice-row">② ダミー</div>
                </div>
            `,
            choices: "NO_KEYS",
            trial_duration: 1000,
            data: { task: 'fixation' }
        };

        // 本課題
        const trial = {
            type: jsPsychHtmlKeyboardResponse,
            choices: ['1', '2'],
            data: {
                task: is_practice ? 'practice' : 'main_trial',
                TrialNumber: stim_data.TrialNumber,
                Type: stim_data.Type,
                WordOrder: stim_data.WordOrder,
                Image1: stim_data.Image1,
                Image2: stim_data.Image2,
                Image3: stim_data.Image3,
                Image4: stim_data.Image4,
                Choice1: stim_data.Choice1, 
                Choice2: stim_data.Choice2  
            },
            stimulus: function() {
                // 選択肢をランダムに配置
                let choices = [
                    { text: stim_data.Choice1, is_correct: true },
                    { text: stim_data.Choice2, is_correct: false }
                ];
                choices = jsPsych.randomization.shuffle(choices);
                
                trial_context.choices = choices;
                trial_context.top_choice = choices[0].text;

                let html = `<div class="emoji-container">`;
                if (stim_data.Image1) html += `<img class="emoji-img" src="${stim_data.Image1}">`;
                if (stim_data.Image2) html += `<img class="emoji-img" src="${stim_data.Image2}">`;
                if (stim_data.Image3) html += `<img class="emoji-img" src="${stim_data.Image3}">`;
                if (stim_data.Image4) html += `<img class="emoji-img" src="${stim_data.Image4}">`;
                html += `</div>`;
                
                html += `<div class="choices-container">`;
                html += `<div class="choice-row">① ${choices[0].text}</div>`;
                html += `<div class="choice-row">② ${choices[1].text}</div>`;
                html += `</div>`;

                return html;
            },
            on_finish: function(data) {
                // 回答の記録 (RTはMATLABに合わせてミリ秒から秒に変換)
                let selected_idx = data.response === '1' ? 0 : 1;
                let selected_choice = trial_context.choices[selected_idx];
                
                data.TopChoice = trial_context.top_choice;
                data.ChoiceSelected = selected_choice.text;
                data.IsCorrect = selected_choice.is_correct ? 1 : 0;
                data.RT = data.rt / 1000; 
                data.TrialOrder = current_trial_order;
                
                // フィードバック用
                trial_context.selected_number = data.response;
                trial_context.selected_text = selected_choice.text;
            }
        };

        let trial_timeline = [fixation, trial];

        // 練習時のみフィードバックを追加
        if (is_practice) {
            const feedback = {
                type: jsPsychHtmlKeyboardResponse,
                choices: ['Enter'],
                stimulus: function() {
                    return `
                        <div style="text-align: center;">
                            <div style="font-size: 28px; margin-bottom: 20px; color: blue; font-weight: bold;">
                                あなたが選んだのは ${trial_context.selected_number}番 の<br><br>
                                「${trial_context.selected_text}」<br><br>
                                でした。
                            </div>
                            <div style="font-size: 20px; color: #666; margin-top: 80px;">
                                Enterキーを押して次に進みます
                            </div>
                        </div>
                    `;
                }
            };
            trial_timeline.push(feedback);
        }

        return { timeline: trial_timeline };
    }

    // -----------------------------------------------------------------
    // 6. タイムラインの構築
    // -----------------------------------------------------------------
    // 練習 (Practice)
    let practice_order = 1;
    for (let i = 0; i < practice_stimuli.length; i++) {
        timeline.push(createExp2Trial(practice_stimuli[i], true, practice_order++));
    }

    // 本番前の教示
    timeline.push({
        type: jsPsychHtmlKeyboardResponse,
        stimulus: `
            <div style="text-align: center;">
                <h2>以上で、練習課題は終了です。</h2>
                <p>これから、実験②の本計測を行います。</p>
                <hr style="width: 50%; margin: 20px auto;">
                <p>ー 操作方法のおさらい ー</p>
                <p><strong>数字キー（1 または 2）</strong>：選択肢の番号を押す</p>
                <p><strong>Enterキー</strong>：次の画面へ進む</p>
                <hr style="width: 50%; margin: 20px auto;">
                <p>準備ができたら、Enterキーを押して本計測を始めてください。</p>
            </div>
        `,
        choices: ['Enter']
    });

    // 本番 (Main Trial) ※シャッフル
    main_stimuli = jsPsych.randomization.shuffle(main_stimuli);
    let main_order = 1;
    for (let i = 0; i < main_stimuli.length; i++) {
        timeline.push(createExp2Trial(main_stimuli[i], false, main_order++));
    }

    // -----------------------------------------------------------------
    // 7. 実行
    // -----------------------------------------------------------------
    const participantId = sessionStorage.getItem("participantId") || "TEST_ID";
    jsPsych.data.addProperties({
        participant_id: participantId
    });

    jsPsych.run(timeline);
</script>
</html>
