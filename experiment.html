<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>絵文字実験</title>
    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
    <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />
    
    <style>
        body {
            background-color: #f9f9f9;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        #exp-container {
            text-align: center;
            margin-top: 5vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }
        #prompt-text {
            font-size: 22px;
            margin-bottom: 50px;
            height: 60px;
        }
        .choice-grid {
            display: grid;
            grid-template-columns: repeat(6, 60px);
            gap: 15px;
            justify-content: center;
            margin-bottom: 80px;
        }
        .choice-item {
            width: 60px;
            height: 60px;
            background-color: #fff;
            cursor: pointer;
            font-size: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.1);
            border-radius: 5px;
            transition: transform 0.1s;
        }
        .choice-item:active {
            transform: scale(0.9);
        }
        .slot-container {
            display: flex;
            gap: 5px;
            justify-content: center;
        }
        .slot {
            width: 60px;
            height: 60px;
            background-color: #fff;
            border: 2px solid #333;
            font-size: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #finish-btn-container {
            position: absolute;
            bottom: 30px;
            right: 30px;
        }
        #btn-finish {
            padding: 10px 40px;
            font-size: 20px;
            cursor: pointer;
            border: 2px solid #333;
            background-color: #eee;
        }
    </style>
</head>
<body></body>
<script>
    const jsPsych = initJsPsych({
        on_finish: function() {
            jsPsych.data.displayData('json'); 
        }
    });

    function createEmojiTrial(task_name, prompt_text, choices, max_slots = 9) {
        return {
            type: jsPsychHtmlKeyboardResponse,
            choices: "NO_KEYS", 
            data: { task: task_name }, 
            stimulus: function() {
                let html = `<div id="exp-container">`;
                html += `<div id="prompt-text">${prompt_text}</div>`;
                html += `<div class="choice-grid">`;
                choices.forEach(c => {
                    html += `<div class="choice-item" data-val="${c}">${c}</div>`;
                });
                html += `</div>`;
                html += `<div class="slot-container">`;
                for(let i=0; i<max_slots; i++){
                    html += `<div class="slot" id="slot-${i}"></div>`;
                }
                html += `</div>`;
                html += `</div>`;
                html += `<div id="finish-btn-container"><button id="btn-finish">完了</button></div>`;
                return html;
            },
            on_load: function() {
                let selected = []; 
                let rt_first = null;
                let backspace_count = 0;
                let start_time = performance.now();
                let is_finished = false;
                
                // ★誤爆防止：画面表示から0.5秒間はEnterを無視するフラグ
                let can_enter = false;
                setTimeout(() => { can_enter = true; }, 500); 

                const updateSlots = () => {
                    for(let i=0; i<max_slots; i++){
                        const slot = document.getElementById(`slot-${i}`);
                        if(slot) slot.innerHTML = selected[i] ? selected[i] : "";
                    }
                };

                const handleInput = (val) => {
                    if(is_finished) return;
                    if(rt_first === null) rt_first = performance.now() - start_time;
                    
                    if(val === '❌') {
                        selected = [];
                        backspace_count++;
                    } else if (val === '⬅️') {
                        selected.pop();
                        backspace_count++;
                    } else {
                        if(selected.length < max_slots) {
                            selected.push(val);
                        }
                    }
                    updateSlots();
                };

                document.querySelectorAll('.choice-item').forEach(el => {
                    el.addEventListener('click', (e) => {
                        handleInput(e.currentTarget.dataset.val);
                    });
                });

                // ★修正点：シンプルに keydown（押し込んだ瞬間）だけを見る
                const keydownHandler = (e) => {
                    if (is_finished) return;

                    if (e.key === 'Backspace') {
                        e.preventDefault();
                        handleInput('⬅️');
                    } else if (e.key === 'Enter') {
                        e.preventDefault();
                        
                        // 画面が出て0.5秒以内なら無視
                        if (!can_enter) return;
                        
                        // キー押しっぱなしによる連続入力なら無視
                        if (e.repeat) return; 
                        
                        finishTrial();
                    }
                };
                document.addEventListener('keydown', keydownHandler);

                const finishTrial = () => {
                    if(is_finished) return;
                    is_finished = true;
                    document.removeEventListener('keydown', keydownHandler);
                    let rt_total = performance.now() - start_time;
                    
                    jsPsych.finishTrial({
                        prompt: prompt_text,
                        response: selected, 
                        rt_first_click: rt_first ? Math.round(rt_first) : null,
                        rt_total: Math.round(rt_total),
                        backspace_count: backspace_count
                    });
                };

                const btn = document.getElementById('btn-finish');
                if(btn) {
                    btn.addEventListener('click', () => {
                        if (can_enter) finishTrial(); // ボタンも0.5秒の誤爆防止を適用
                    });
                }
            }
        };
    }

    const timeline = [];

    // --- チュートリアル1 ---
    const tutorial_1_prompt = '以下に表示される数字画像をクリックし、「1→2→3→4」の順番になるように並べ替えましょう。<br>入力が完了したら、Enterキーまたは「完了」ボタンを押してください。';
    const tutorial_1_choices = ['❌', '⬅️', '1', '2', '3', '4'];
    
    const trial_tut_1 = createEmojiTrial('tutorial_1', tutorial_1_prompt, tutorial_1_choices, 8);

    const error_screen_1 = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<h2>不正解です。</h2><p>Enterキーを押してもう一度やり直してください。</p>',
        choices: ['Enter']
    };
    
    const conditional_error_1 = {
        timeline: [error_screen_1],
        conditional_function: function() {
            const last_trial = jsPsych.data.get().last(1).values()[0];
            const correct = ["1", "2", "3", "4"];
            return JSON.stringify(last_trial.response) !== JSON.stringify(correct);
        }
    };

    const tutorial_1_loop = {
        timeline: [trial_tut_1, conditional_error_1],
        loop_function: function() {
            const last_tut_data = jsPsych.data.get().filter({task: 'tutorial_1'}).last(1).values()[0];
            const correct = ["1", "2", "3", "4"];
            return JSON.stringify(last_tut_data.response) !== JSON.stringify(correct);
        }
    };
    
    timeline.push({
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<p>はじめに、操作の練習を行います。<br>Enterキーを押して進んでください。</p>',
        choices: ['Enter']
    });
    timeline.push(tutorial_1_loop);
    timeline.push({
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<h2>正解です！</h2><p>Enterキーを押して本番に進んでください。</p>',
        choices: ['Enter']
    });

    // --- 本計測 (Trial) ---
    const emoji_choices = ['❌', '⬅️', '🍎', '👦', '🐱', '🏃', '🔪', '🐶', '👧', '✉️', '👀', '📝'];
    const stimuli_list = [
        { prompt: "男の子がリンゴを切る" },
        { prompt: "女の子が犬を走らせる" }
    ];

    timeline.push({
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<h2>本番です。</h2><p>Enterキーを押して始めてください。</p>',
        choices: ['Enter']
    });

    for (let i = 0; i < stimuli_list.length; i++) {
        timeline.push(
            createEmojiTrial('main_trial', stimuli_list[i].prompt, emoji_choices, 9)
        );
    }

    const participantId = sessionStorage.getItem("participantId") || "TEST_ID";
    jsPsych.data.addProperties({
        participant_id: participantId
    });

    jsPsych.run(timeline);
</script>
</html>
