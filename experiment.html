<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>絵文字実験</title>
    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
    <!-- ★プリロード（画像の事前読み込み）プラグインを追加 -->
    <script src="https://unpkg.com/@jspsych/plugin-preload@1.1.3"></script>
    <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />
    
    <style>
        body {
            background-color: #f9f9f9;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        #exp-container {
            text-align: center;
            margin-top: 5vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }
        #prompt-text {
            font-size: 22px;
            margin-bottom: 50px;
            height: 80px;
        }
        .choice-grid {
            display: grid;
            grid-template-columns: repeat(6, 60px);
            gap: 15px;
            justify-content: center;
            margin-bottom: 80px;
        }
        .choice-item {
            width: 60px;
            height: 60px;
            background-color: #fff;
            cursor: pointer;
            font-size: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.1);
            border-radius: 5px;
            transition: transform 0.1s;
        }
        .choice-item:active {
            transform: scale(0.9);
        }
        .slot-container {
            display: flex;
            gap: 5px;
            justify-content: center;
        }
        .slot {
            width: 60px;
            height: 60px;
            background-color: #fff;
            border: 2px solid #333;
            font-size: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #finish-btn-container {
            position: absolute;
            bottom: 30px;
            right: 30px;
        }
        #btn-finish {
            padding: 10px 40px;
            font-size: 20px;
            cursor: pointer;
            border: 2px solid #333;
            background-color: #eee;
        }
    </style>
</head>
<body>
</body>
<script>
    // -----------------------------------------------------------------
    // 1. jsPsychの初期化とGASへのデータ送信
    // -----------------------------------------------------------------
    const jsPsych = initJsPsych({
        on_finish: function() {
            const exp_data = jsPsych.data.get().filterCustom(function(trial){
                return trial.task === 'practice' || trial.task === 'main_trial';
            }).values();

            let practice_count = 1;
            let main_count = 1;
            exp_data.forEach(trial => {
                if (trial.task === 'practice') {
                    trial.custom_trial_index = practice_count++;
                } else if (trial.task === 'main_trial') {
                    trial.custom_trial_index = main_count++;
                }
            });

            document.body.innerHTML = `
                <div style="text-align:center; margin-top: 20vh; font-family: sans-serif;">
                    <h2>実験①が終了しました。</h2>
                    <p>現在、データを安全に送信しています。この画面を閉じずにお待ちください...</p>
                    <p id="status-text" style="color: blue;"></p>
                </div>
            `;

            // ▼ ★★★ ここに統合版のGASのURLを貼り付けます ★★★ ▼
            const scriptURL = 'https://script.google.com/macros/s/AKfycbwVqXvpBAPl7oMy3tQmesAynI3XVaDdOEZDpTs1nc40i3hPvP8EKAThZbTpauluKdCWDw/exec';

            fetch(scriptURL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify(exp_data)
            })
            .then(response => {
                document.getElementById('status-text').style.color = "green";
                
                // ▼ ★ここを「終了メッセージ」から「実験②へ進むボタン」に書き換えます！
                document.getElementById('status-text').innerHTML = `
                    <b>実験①のデータの送信が完了しました！<br><br>
                    <b>下のボタンを押して、次の実験②に進んでください。<br><br>
                    <button onclick="window.location.href='experiment2.html'" style="padding:15px 30px; font-size:20px; cursor:pointer; background-color:#4CAF50; color:white; border:none; border-radius:5px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                        実験②へ進む
                    </button></b>
                `;
            })
            .catch(error => {
                document.getElementById('status-text').style.color = "red";
                document.getElementById('status-text').innerHTML = "<b>通信エラーが発生しました。インターネット接続を確認してください。</b>";
            });
        }
    });

    // -----------------------------------------------------------------
    // 2. 試行を作成する関数（画像と文字を自動判別）
    // -----------------------------------------------------------------
    function createEmojiTrial(task_name, prompt_text, choices, max_slots = 9) {
        return {
            type: jsPsychHtmlKeyboardResponse,
            choices: "NO_KEYS", 
            data: { task: task_name }, 
            stimulus: function() {
                let html = `<div id="exp-container">`;
               html += `<div id="prompt-text">${prompt_text}</div>`;
                
                // 選択肢が4つ（チュートリアル）の時は4列、それ以外は6列にする
                let grid_cols = choices.length === 4 ? 4 : 6;
                html += `<div class="choice-grid" style="grid-template-columns: repeat(${grid_cols}, 60px);">`;
                
                choices.forEach(c => {
                    // ★ .png を含む場合は <img> タグに、それ以外(数字など)は文字として表示
                    let content = c.includes('.png') ? `<img src="${c}" style="width:100%; height:100%; object-fit:contain; pointer-events:none;">` : c;
                    html += `<div class="choice-item" data-val="${c}">${content}</div>`;
                });
                html += `</div>`;
                html += `<div class="slot-container">`;
                for(let i=0; i<max_slots; i++){
                    html += `<div class="slot" id="slot-${i}"></div>`;
                }
                html += `</div>`;
                html += `</div>`;
                html += `<div id="finish-btn-container"><button id="btn-finish">完了</button></div>`;
                return html;
            },
            on_load: function() {
                let selected = []; 
                let rt_first = null;
                let backspace_count = 0;
                let start_time = performance.now();
                let is_finished = false;
                
                let can_enter = false;
                setTimeout(() => { can_enter = true; }, 500); 

                const updateSlots = () => {
                    for(let i=0; i<max_slots; i++){
                        const slot = document.getElementById(`slot-${i}`);
                        if(slot) {
                            let val = selected[i] ? selected[i] : "";
                            // ★ 回答枠も .png を含む場合は <img> タグに変換
                            slot.innerHTML = val.includes('.png') ? `<img src="${val}" style="width:100%; height:100%; object-fit:contain;">` : val;
                        }
                    }
                };

                // ★ 画像(×や←も含む)はすべて「絵文字」として回答枠に入る（機能は持たない）
                const handleInput = (val) => {
                    if(is_finished) return;
                    if(rt_first === null) rt_first = performance.now() - start_time;
                    
                    if(selected.length < max_slots) {
                        selected.push(val);
                    }
                    updateSlots();
                };

                document.querySelectorAll('.choice-item').forEach(el => {
                    el.addEventListener('click', (e) => {
                        handleInput(e.currentTarget.dataset.val);
                    });
                });

                // ★ 取り消し操作は物理的なBackspaceキーのみで行う
                const keydownHandler = (e) => {
                    if (is_finished) return;

                    if (e.key === 'Backspace') {
                        e.preventDefault();
                        if(selected.length > 0) {
                            selected.pop(); 
                            backspace_count++;
                            updateSlots();
                        }
                    } else if (e.key === 'Enter') {
                        e.preventDefault();
                        if (!can_enter) return;
                        if (e.repeat) return; 
                        finishTrial();
                    }
                };
                document.addEventListener('keydown', keydownHandler);

                const finishTrial = () => {
                    if(is_finished) return;
                    is_finished = true;
                    document.removeEventListener('keydown', keydownHandler);
                    let rt_total = performance.now() - start_time;
                    
                    // 現在の刺激データ（Typeや画像名など）を取得して保存データに含める
                    let trial_data = {
                        prompt: prompt_text,
                        response: selected,
                        // MATLABの形式に合わせて「->」で繋いだ文字列として保存する
                        response_str: selected.join(" -> "), 
                        rt_first_click: rt_first ? Math.round(rt_first) / 1000 : null, // ★MATLABに合わせてミリ秒から秒に変換
                        rt_total: Math.round(rt_total) / 1000,                         // ★MATLABに合わせて秒に変換
                        backspace_count: backspace_count
                    };

                    // 本番の刺激文にだけ含まれている属性データがあれば、それも追加する
                    const current_stimulus = main_stimuli.find(s => s.prompt === prompt_text);
                    if (current_stimulus) {
                        trial_data.type = current_stimulus.type;
                        trial_data.neg = current_stimulus.neg;
                        trial_data.past = current_stimulus.past;
                        trial_data.scram = current_stimulus.scram;
                        trial_data.oPlural = current_stimulus.oPlural;
                        trial_data.sPlural = current_stimulus.sPlural;
                        trial_data.img1 = current_stimulus.img1;
                        trial_data.img2 = current_stimulus.img2;
                        trial_data.img3 = current_stimulus.img3;
                        trial_data.img4 = current_stimulus.img4;
                    }

                    jsPsych.finishTrial(trial_data);
                };

                const btn = document.getElementById('btn-finish');
                if(btn) {
                    btn.addEventListener('click', () => {
                        if (can_enter) finishTrial();
                    });
                }
            }
        };
    }

    const timeline = [];

    // ▼ ★★★ ここに GitHub にアップロードした画像ファイル名(.png)をすべて並べます ★★★ ▼
    const emoji_choices = [
        'Neg.png', // ×の画像ファイル名
        'Past.png',  // ←の画像ファイル名
        'apple.png', // リンゴの画像ファイル名
        'boy.png', // 男の子の画像ファイル名
        'cat.png',   // 猫の画像ファイル名
        'chase.png', // 追いかけるの画像ファイル名
        'cut.png',   // 切るの画像ファイル名
        'dog.png', // 犬の画像ファイル名
        'girl.png', // 女の子の画像ファイル
        'letter.png', // 手紙の画像ファイル
        'search.png',   // 探すの画像ファイル名
        'write.png', // 書くの画像ファイル名
        
        // 必要に応じてコンマ(,)で区切って追加してください
    ];

    // .png ファイルだけを抽出してプリロード（事前読み込み）する
    const preload_images = emoji_choices.filter(c => c.includes('.png'));
    timeline.push({
        type: jsPsychPreload,
        images: preload_images,
        message: 'データを読み込んでいます。少々お待ちください...',
        continue_after_error: true
    });

    // ==========================================
    // チュートリアル1 (1→2→3→4)
    // ==========================================
    const tutorial_1_prompt = '以下に表示される数字画像をクリックし、「1→2→3→4」の順番になるように並べ替えましょう。<br>（入力を取り消す場合は、キーボードのBackspaceキーを押してください）<br>入力が完了したら、Enterキーまたは「完了」ボタンを押してください。';
    const tutorial_choices = ['1', '2', '3', '4'];
    
    const trial_tut_1 = createEmojiTrial('tutorial_1', tutorial_1_prompt, tutorial_choices, 8);

    const error_screen_1 = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<h2>不正解です。</h2><p>Enterキーを押してもう一度やり直してください。</p>',
        choices: ['Enter']
    };
    
    const conditional_error_1 = {
        timeline: [error_screen_1],
        conditional_function: function() {
            const last_trial = jsPsych.data.get().last(1).values()[0];
            // ★ response_str を使って文字列で直接判定する
            return last_trial.response_str !== "1 -> 2 -> 3 -> 4";
        }
    };

    const tutorial_1_loop = {
        timeline: [trial_tut_1, conditional_error_1],
        loop_function: function() {
            const last_tut_data = jsPsych.data.get().filter({task: 'tutorial_1'}).last(1).values()[0];
            // ★ こちらも response_str を使って判定する
            return last_tut_data.response_str !== "1 -> 2 -> 3 -> 4";
        }
    };
    
    timeline.push({
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<p>はじめに、実験①の操作の練習を行います。<br>Enterキーを押して進んでください。</p>',
        choices: ['Enter']
    });
    timeline.push(tutorial_1_loop);
    timeline.push({
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<h2>正解です！</h2><p>Enterキーを押して次の練習に進んでください。</p>',
        choices: ['Enter']
    });

    // ==========================================
    // チュートリアル2 (1→1→2→3)
    // ==========================================
    const tutorial_2_prompt = '同じ画像は何度でもクリックして選ぶことができます。<br>以下に表示される数字画像を「1→1→2→3」の順番になるように並べ替えましょう。<br>入力が完了したら、Enterキーまたは「完了」ボタンを押してください。';
    
    const trial_tut_2 = createEmojiTrial('tutorial_2', tutorial_2_prompt, tutorial_choices, 8);

    const error_screen_2 = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<h2>不正解です。</h2><p>Enterキーを押してもう一度やり直してください。</p>',
        choices: ['Enter']
    };
    
    const conditional_error_2 = {
        timeline: [error_screen_2],
        conditional_function: function() {
            const last_trial = jsPsych.data.get().last(1).values()[0];
            // ★ response_str を使って判定 (1 -> 1 -> 2 -> 3)
            return last_trial.response_str !== "1 -> 1 -> 2 -> 3";
        }
    };

    const tutorial_2_loop = {
        timeline: [trial_tut_2, conditional_error_2],
        loop_function: function() {
            const last_tut_data = jsPsych.data.get().filter({task: 'tutorial_2'}).last(1).values()[0];
            // ★ こちらも response_str を使って判定
            return last_tut_data.response_str !== "1 -> 1 -> 2 -> 3";
        }
    };
    
    timeline.push(tutorial_2_loop);
    timeline.push({
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<h2>正解です！</h2><p>Enterキーを押して本番に進んでください。</p>',
        choices: ['Enter']
    });

    // ==========================================
    // 練習 (Practice)
    // ==========================================
    timeline.push({
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<h2>絵文字を用いた本番形式の練習</h2><p>以下の日本語文を絵文字を並べて表して下さい。<br>絵文字を並べ終えたらEnterキーを押してください。</p><p>Enterキーを押して始めます。</p>',
        choices: ['Enter']
    });

    // ▼ ★★★ ここに Practice 用の刺激文を Excel から貼り付けます ★★★ ▼
    let practice_stimuli = [
{ prompt: "男の子がリンゴを切る" },
{ prompt: "女の子が手紙を書く" },
{ prompt: "女の子が複数の手紙を書く" },
{ prompt: "男の子が犬を追いかけない" },
{ prompt: "女の子が猫を探さない" },
{ prompt: "猫を女の子が探す" },
    ];

    // 練習の順番をシャッフル
    practice_stimuli = jsPsych.randomization.shuffle(practice_stimuli);

    for (let i = 0; i < practice_stimuli.length; i++) {
        timeline.push(
            createEmojiTrial('practice', practice_stimuli[i].prompt, emoji_choices, 9)
        );
    }

    // ==========================================
    // 本計測 (Main Trial)
    // ==========================================
    timeline.push({
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<h2>それでは、実験①の本番です。全部で24試行あります。</h2><p>準備ができたら、Enterキーを押して始めてください。</p>',
        choices: ['Enter']
    });

// ▼ ★★★ ここに Stimuli(本番) 用の刺激文を貼り付けます ★★★ ▼
    let main_stimuli = [
        { prompt: "男の子がリンゴを切る", type: 1, neg: 0, past: 0, scram: 0, oPlural: 0, sPlural: 0, img1: "boy.png", img2: "apple.png", img3: "cut.png", img4: "" },
        { prompt: "男の子がリンゴを切らない", type: 1, neg: 1, past: 0, scram: 0, oPlural: 0, sPlural: 0, img1: "boy.png", img2: "apple.png", img3: "cut.png", img4: "Neg.png" },
        { prompt: "男の子がリンゴを切った", type: 1, neg: 0, past: 1, scram: 0, oPlural: 0, sPlural: 0, img1: "boy.png", img2: "apple.png", img3: "cut.png", img4: "Past.png" },
        { prompt: "リンゴを男の子が切る", type: 1, neg: 0, past: 0, scram: 1, oPlural: 0, sPlural: 0, img1: "apple.png", img2: "boy.png", img3: "cut.png", img4: "" },
        { prompt: "男の子が複数のリンゴを切る", type: 1, neg: 0, past: 0, scram: 0, oPlural: 1, sPlural: 0, img1: "boy.png", img2: "apple.png", img3: "apple.png", img4: "cut.png" },
        { prompt: "複数の男の子がリンゴを切る", type: 1, neg: 0, past: 0, scram: 0, oPlural: 0, sPlural: 1, img1: "boy.png", img2: "boy.png", img3: "apple.png", img4: "cut.png" },
        { prompt: "女の子が手紙を書く", type: 1, neg: 0, past: 0, scram: 0, oPlural: 0, sPlural: 0, img1: "girl.png", img2: "letter.png", img3: "write.png", img4: "" },
        { prompt: "女の子が手紙を書かない", type: 1, neg: 1, past: 0, scram: 0, oPlural: 0, sPlural: 0, img1: "girl.png", img2: "letter.png", img3: "write.png", img4: "Neg.png" },
        { prompt: "女の子が手紙を書いた", type: 1, neg: 0, past: 1, scram: 0, oPlural: 0, sPlural: 0, img1: "girl.png", img2: "letter.png", img3: "write.png", img4: "Past.png" },
        { prompt: "手紙を女の子が書く", type: 1, neg: 0, past: 0, scram: 1, oPlural: 0, sPlural: 0, img1: "letter.png", img2: "girl.png", img3: "write.png", img4: "" },
        { prompt: "女の子が複数の手紙を書く", type: 1, neg: 0, past: 0, scram: 0, oPlural: 1, sPlural: 0, img1: "girl.png", img2: "letter.png", img3: "letter.png", img4: "write.png" },
        { prompt: "複数の女の子が手紙を書く", type: 1, neg: 0, past: 0, scram: 0, oPlural: 0, sPlural: 1, img1: "girl.png", img2: "girl.png", img3: "letter.png", img4: "write.png" },
        { prompt: "男の子が犬を追いかける", type: 2, neg: 0, past: 0, scram: 0, oPlural: 0, sPlural: 0, img1: "boy.png", img2: "dog.png", img3: "chase.png", img4: "" },
        { prompt: "男の子が犬を追いかけない", type: 2, neg: 1, past: 0, scram: 0, oPlural: 0, sPlural: 0, img1: "boy.png", img2: "dog.png", img3: "chase.png", img4: "Neg.png" },
        { prompt: "男の子が犬を追いかけた", type: 2, neg: 0, past: 1, scram: 0, oPlural: 0, sPlural: 0, img1: "boy.png", img2: "dog.png", img3: "chase.png", img4: "Past.png" },
        { prompt: "犬を男の子が追いかける", type: 2, neg: 0, past: 0, scram: 1, oPlural: 0, sPlural: 0, img1: "dog.png", img2: "boy.png", img3: "chase.png", img4: "" },
        { prompt: "男の子が複数の犬を追いかける", type: 2, neg: 0, past: 0, scram: 0, oPlural: 1, sPlural: 0, img1: "boy.png", img2: "dog.png", img3: "dog.png", img4: "chase.png" },
        { prompt: "複数の男の子が犬を追いかける", type: 2, neg: 0, past: 0, scram: 0, oPlural: 0, sPlural: 1, img1: "boy.png", img2: "boy.png", img3: "dog.png", img4: "chase.png" },
        { prompt: "女の子が猫を探す", type: 2, neg: 0, past: 0, scram: 0, oPlural: 0, sPlural: 0, img1: "girl.png", img2: "cat.png", img3: "search.png", img4: "" },
        { prompt: "女の子が猫を探さない", type: 2, neg: 1, past: 0, scram: 0, oPlural: 0, sPlural: 0, img1: "girl.png", img2: "cat.png", img3: "search.png", img4: "Neg.png" },
        { prompt: "女の子が猫を探した", type: 2, neg: 0, past: 1, scram: 0, oPlural: 0, sPlural: 0, img1: "girl.png", img2: "cat.png", img3: "search.png", img4: "Past.png" },
        { prompt: "猫を女の子が探す", type: 2, neg: 0, past: 0, scram: 1, oPlural: 0, sPlural: 0, img1: "cat.png", img2: "girl.png", img3: "search.png", img4: "" },
        { prompt: "女の子が複数の猫を探す", type: 2, neg: 0, past: 0, scram: 0, oPlural: 1, sPlural: 0, img1: "girl.png", img2: "cat.png", img3: "cat.png", img4: "search.png" },
        { prompt: "複数の女の子が猫を探す", type: 2, neg: 0, past: 0, scram: 0, oPlural: 0, sPlural: 1, img1: "girl.png", img2: "girl.png", img3: "cat.png", img4: "search.png" }
    ];

    // 本番の順番をシャッフル
    main_stimuli = jsPsych.randomization.shuffle(main_stimuli);

    for (let i = 0; i < main_stimuli.length; i++) {
        timeline.push(
            createEmojiTrial('main_trial', main_stimuli[i].prompt, emoji_choices, 9)
        );
    }

    // -----------------------------------------------------------------
    // 実行
    // -----------------------------------------------------------------
    const participantId = sessionStorage.getItem("participantId") || "TEST_ID";
    jsPsych.data.addProperties({
        participant_id: participantId
    });

    jsPsych.run(timeline);
</script>
</html>
